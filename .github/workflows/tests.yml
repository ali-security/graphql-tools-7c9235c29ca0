name: Tests

env:
  NODE_NO_WARNINGS: true
  NODE_OPTIONS: '--max-old-space-size=8192'
  CI: true

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jest test path/name filter'
        required: false
        default: ''

jobs:
  prettier-check:
    name: 🧹 Prettier Check
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3

      - name: Setup env
        uses: the-guild-org/shared-config/setup@531f7883355f4d86175cb8cbb0fee65ac9a66451
        with:
          nodeVersion: 18

      - name: Prettier Check
        run: yarn prettier:check
  lint:
    name: Lint
    if: false
    uses: the-guild-org/shared-config/.github/workflows/lint.yml@main
    with:
      script: yarn ci:lint
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Type Check on GraphQL v${{matrix.graphql_version}}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graphql_version:
          - 15
          - 16
          - '17.0.0-alpha.1'
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3

      - name: Setup env
        uses: the-guild-org/shared-config/setup@531f7883355f4d86175cb8cbb0fee65ac9a66451
        with:
          nodeVersion: 18

      - name: Use GraphQL v${{matrix.graphql_version}}
        run: node ./scripts/match-graphql.js ${{matrix.graphql_version}}
      - name: Install Dependencies using Yarn
        run: yarn install --ignore-engines && git checkout yarn.lock
      - name: Type Check
        run: yarn ts:check
  test:
    name: Unit Test on Node ${{matrix.node-version}} (${{matrix.os}}) and GraphQL v${{matrix.graphql_version}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # remove windows to speed up the tests
        node-version: [14, 16, 18]
        graphql_version:
          - 15
          - 16
          - '17.0.0-alpha.1'
        include:
          - node-version: 14
            os: windows-latest
            graphql_version: 15
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3

      - name: Setup env
        uses: the-guild-org/shared-config/setup@531f7883355f4d86175cb8cbb0fee65ac9a66451
        with:
          nodeVersion: ${{matrix.node-version}}

      - name: Use GraphQL v${{matrix.graphql_version}}
        run: node ./scripts/match-graphql.js ${{matrix.graphql_version}}
      - name: Install Dependencies using Yarn
        run: yarn install --ignore-engines && git checkout yarn.lock
      - name: Cache Jest
        uses: actions/cache@v3
        with:
          path: .cache/jest
          key: ${{ runner.os }}-${{matrix.node-version}}-${{matrix.graphql_version}}-jest-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{matrix.node-version}}-${{matrix.graphql_version}}-jest-
      - name: Test
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: yarn test --ci ${{ inputs.test-filter }}
  test_esm:
    name: ESM Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3

      - name: Setup env
        uses: the-guild-org/shared-config/setup@531f7883355f4d86175cb8cbb0fee65ac9a66451
        with:
          nodeVersion: 18

      - name: Build Packages
        run: yarn build
      - name: Test ESM and CJS integrity
        run: yarn bob check
      - name: Pack @graphql-tools/utils
        working-directory: packages/utils/dist
        run: |
          npm i -g npm@8.19.3
          npm pack
          mkdir -p "$GITHUB_WORKSPACE/seal-artifacts"
          mv graphql-tools-utils-*.tgz "$GITHUB_WORKSPACE/seal-artifacts/utils-9.2.1.tgz"
      - name: Upload @graphql-tools/utils tarball
        uses: actions/upload-artifact@v4
        with:
          name: utils-tgz
          path: seal-artifacts/utils-9.2.1.tgz
          if-no-files-found: error
  test_browser:
    name: Browser Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Master
        uses: actions/checkout@v3
      - name: Setup env
        uses: the-guild-org/shared-config/setup@531f7883355f4d86175cb8cbb0fee65ac9a66451
        with:
          nodeVersion: 18
      - name: Build Packages
        run: yarn build
      - name: Allow Chromium sandbox (Ubuntu 24.04 restricts unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: TEST_BROWSER=true yarn jest --no-watchman --ci browser
